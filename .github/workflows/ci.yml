name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drivesense_test
          POSTGRES_USER: drivesense_test
          POSTGRES_PASSWORD: drivesense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivesense_test -d drivesense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://drivesense_test:drivesense_test@localhost:5432/drivesense_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint (phone simulator)
        run: ruff check ../mobile/simulator

      - name: Run pytest
        run: pytest -v

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker · images + Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet && docker compose --profile test config --quiet

      - name: Build backend image
        run: docker build --target runtime -t drivesense-backend:ci src/backend

      - name: Build frontend image
        run: docker build -t drivesense-frontend:ci src/frontend

  terraform:
    name: Terraform · fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Replay 10 simulated readings through the ingestor (CI has no IoT Hub)
        run: |
          python src/mobile/simulator/send_events.py --dry-run --count 10 > events.json
          docker compose run --rm -T --build ingestor python -m app.ingest --replay - < events.json

      - name: Verify events through the frontend proxy
        run: |
          python - <<'EOF'
          import json, urllib.request
          body = json.load(urllib.request.urlopen("http://localhost:3000/api/events", timeout=10))
          assert body["total_events"] == 10, body
          assert body["count"] == 10, body
          print("Smoke test passed:", body["total_events"], "events,", body["unique_devices"], "device(s)")
          EOF

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
